<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión del S.I.S</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
  <div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
      <div class="flex flex-col items-center justify-center text-center mb-6">
        <img src="img/logo.svg" alt="Logo SENA" class="h-16 w-auto mb-3" />

        <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">Iniciar Sesión</h2>
      </div>

      <form class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
          <input type="email" placeholder="tu@email.com"
            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6cba42]" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
          <input type="password" placeholder="••••••••"
            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6cba42]" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Sede</label>

          <select name="sede" id="sede"
            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6cba42]">
            <option value="" selected disabled>Selecciona</option>
            <option value="1">Villeta</option>
            <option value="2">Pacho</option>
          </select>
        </div>

        <a href="dashboard.html"
          class="flex justify-center items-center w-full bg-[#6cba42] hover:bg-[#5aa334] text-white font-semibold py-2 rounded-lg transition duration-200">
          Entrar
        </a>
      </form>
    </div>
  </div>
</body>

</html>
