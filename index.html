<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión - S.I.S SENA</title>
  
  <!-- Estilos globales y configuración de variables -->
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'sena-verde': 'var(--sena-verde-brand)',
            'sena-naranja': 'var(--sena-naranja)',
            'sena-verde-oscuro': 'var(--sena-verde-oscuro)',
            'sena-azul': 'var(--sena-azul-oscuro)',
            'sena-blanco': 'var(--sena-blanco)',
            'sena-gris': 'var(--sena-fondo-gris)',
            'sena-texto': 'var(--sena-texto-principal)',
          }
        }
      }
    }
  </script>
</head>

<body class="bg-sena-gris min-h-screen flex items-center justify-center p-4 text-sena-texto">
  <div class="bg-sena-blanco p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-sena-verde">
    
    <!-- Encabezado y Logo -->
    <div class="flex flex-col items-center justify-center text-center mb-6">
      <img src="img/logo.svg" alt="Logo SENA" class="h-16 w-auto mb-3" />
      <h2 class="text-2xl font-bold text-sena-azul">Iniciar Sesión</h2>
      <p class="text-xs text-slate-500 mt-1">Sistema de Información y Seguimiento de Ambientes</p>
    </div>

    <!-- Formulario de Acceso -->
    <form class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-sena-texto mb-1">Correo Electrónico</label>
        <input type="email" placeholder="tu@soy.sena.edu.co"
          class="w-full px-4 py-2.5 bg-sena-gris border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sena-verde focus:border-sena-verde transition" />
      </div>

      <div>
        <label class="block text-sm font-semibold text-sena-texto mb-1">Contraseña</label>
        <input type="password" placeholder="••••••••"
          class="w-full px-4 py-2.5 bg-sena-gris border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sena-verde focus:border-sena-verde transition" />
      </div>

      <div>
        <label class="block text-sm font-semibold text-sena-texto mb-1">Sede</label>
        <select name="sede" id="sede"
          class="w-full px-4 py-2.5 bg-sena-gris border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sena-verde focus:border-sena-verde transition">
          <option value="" selected disabled>Selecciona una sede</option>
          <option value="1">Villeta</option>
          <option value="2">Pacho</option>
        </select>
      </div>

      <a href="dashboard.html"
        class="flex justify-center items-center w-full bg-sena-verde hover:bg-sena-verde-oscuro text-sena-blanco font-semibold py-3 rounded-xl transition duration-200 shadow-sm mt-2">
        Entrar
      </a>
    </form>

  </div>
</body>

</html>
